seed: 42
data:
  stage1_dir: None
  embedding_files:
    train: stage1_train_embeddings.npz
    val: stage1_val_embeddings.npz
    test: stage1_test_embeddings.npz
  metadata_csv: stage1_flow_metadata.csv
  timestamp_col: flow_start_timestamp_us
  source_col: source_id
  destination_col: destination_id

context:
  method: source_host
  window_size: 128
  include_target: true
  context_policy: online
  endpoint_mode: same_endpoint
  deduplicate: true

model:
  model_type: lstm
  d_model: null
  lstm_hidden_dim: 256
  lstm_num_layers: 2
  lstm_bidirectional: false
  dropout: 0.3
  num_classes: 2
  pooling: last

training:
  epochs: 500
  batch_size: 128
  lr: 3.0e-05
  weight_decay: 0.0003
  num_workers: 2
  patience: 15
  metric_for_best: pr_auc
  use_weighted_sampler: true
  class_weighted_loss: false
  grad_clip_norm: 0.5
  threshold: 0.5
  auto_threshold: true
  threshold_metric: f1_label1
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_steps: 199
  amp: true
  device: auto
  select_threshold_each_epoch: true
  sampler_pos_fraction: 0.08
  loss_type: focal
  alpha:
  - 1.0
  - 1.05
  focal_gamma: 1.0
  label_smoothing: 0.0
  min_delta: 0.0001